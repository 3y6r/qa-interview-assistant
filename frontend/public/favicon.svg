<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 896 896" style="background:transparent" role="img" aria-labelledby="title desc">
  <title id="title">Иконка сервиса найма сотрудников</title>
  <desc id="desc">Человечек в увеличительном стекле с галочкой на тёмном сине-фиолетовом фоне.</desc>

  <defs>
    <linearGradient id="bg" x1="130" y1="900" x2="900" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071A57"/>
      <stop offset="0.52" stop-color="#111F66"/>
      <stop offset="1" stop-color="#43207A"/>
    </linearGradient>

    <linearGradient id="ring" x1="250" y1="220" x2="780" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#E8E7FF"/>
      <stop offset="0.76" stop-color="#B87CFF"/>
      <stop offset="1" stop-color="#4E58FF"/>
    </linearGradient>

    <linearGradient id="person" x1="410" y1="330" x2="630" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEE7FF"/>
      <stop offset="1" stop-color="#6668FF"/>
    </linearGradient>

    <linearGradient id="check" x1="560" y1="610" x2="790" y2="795" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33E1E7"/>
      <stop offset="0.55" stop-color="#23C9F5"/>
      <stop offset="1" stop-color="#3A64FF"/>
    </linearGradient>

    <linearGradient id="handle" x1="660" y1="680" x2="850" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B64FF"/>
      <stop offset="1" stop-color="#255CFF"/>
    </linearGradient>

    <linearGradient id="spark" x1="688" y1="205" x2="770" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35DDF4"/>
      <stop offset="1" stop-color="#B25CFF"/>
    </linearGradient>

    <linearGradient id="cardLeft" x1="120" y1="380" x2="350" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D5FCB" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0D2C72" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="cardRight" x1="700" y1="380" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7048D6" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#2B226F" stop-opacity="0.42"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050B2C" flood-opacity="0.38"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="appClip">
      <rect x="64" y="64" width="896" height="896" rx="190"/>
    </clipPath>
  </defs>

  <g clip-path="url(#appClip)">
    <rect x="64" y="64" width="896" height="896" rx="190" fill="url(#bg)"/>
    <circle cx="835" cy="180" r="240" fill="#7027B8" opacity="0.12"/>
    <circle cx="180" cy="870" r="300" fill="#0A4AAA" opacity="0.12"/>

    <!-- Карточки кандидатов -->
    <g opacity="0.9">
      <rect x="128" y="370" width="206" height="298" rx="34" fill="url(#cardLeft)"/>
      <circle cx="225" cy="441" r="28" fill="#4B7CE8"/>
      <path d="M181 525c0-34 20-55 44-55s44 21 44 55v18h-88z" fill="#4B7CE8"/>
      <rect x="169" y="582" width="112" height="18" rx="9" fill="#416FDE" opacity="0.9"/>
      <rect x="169" y="625" width="112" height="18" rx="9" fill="#416FDE" opacity="0.72"/>

      <rect x="690" y="370" width="206" height="298" rx="34" fill="url(#cardRight)"/>
      <circle cx="798" cy="441" r="28" fill="#7557E6"/>
      <path d="M754 525c0-34 20-55 44-55s44 21 44 55v18h-88z" fill="#7557E6"/>
      <rect x="744" y="582" width="112" height="18" rx="9" fill="#765CE0" opacity="0.9"/>
      <rect x="744" y="625" width="112" height="18" rx="9" fill="#765CE0" opacity="0.72"/>
    </g>

    <!-- Увеличительное стекло -->
    <g filter="url(#shadow)">
      <circle cx="506" cy="515" r="251" fill="none" stroke="url(#ring)" stroke-width="46"/>
      <path d="M683 692 L814 823" stroke="url(#handle)" stroke-width="68" stroke-linecap="round"/>
    </g>

    <!-- Человечек -->
    <g filter="url(#shadow)">
      <circle cx="506" cy="433" r="78" fill="url(#person)"/>
      <path d="M390 706v-74c0-80 49-128 116-128s116 48 116 128v74z" fill="url(#person)"/>
    </g>

    <!-- Галочка -->
    <path d="M558 697l54 54 118-130" fill="none" stroke="url(#check)" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

    <!-- Искра -->
    <path d="M728 198c8 46 29 68 70 76-41 8-62 31-70 77-8-46-29-69-70-77 41-8 62-30 70-76z"
          fill="url(#spark)" filter="url(#softGlow)"/>
  </g>
</svg>
